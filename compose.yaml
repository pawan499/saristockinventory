services:
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}) }'"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongo_data:
